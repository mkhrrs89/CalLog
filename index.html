<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FoodLog" />
  <title>FoodLog</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    /* Disable double-tap zoom while preserving scrolling and pinch-to-zoom. */
    html,
    body,
    button,
    [role="button"] {
      touch-action: manipulation;
    }

    /* iPhone browsers zoom focused form controls when their text is below 16px. */
    @supports (-webkit-touch-callout: none) {
      input, select, textarea {
        font-size: 16px;
      }
    }

    /* Keep food names visually lighter and slightly more compact throughout the app. */
    .food-name,
    .quick-food-main > strong,
    .search-result > span:first-child > strong {
      font-size: 0.9rem;
      font-weight: 400;
    }

    /* Reduce the headline calorie total slightly while preserving its bold emphasis. */
    .total-number {
      font-size: clamp(2.15rem, 10.5vw, 4rem);
      font-weight: 900;
    }

    /* Make Quick Log tiles shorter without changing typography. */
    .quick-food-main {
      padding-top: 0.45rem;
      padding-bottom: 0.45rem;
    }

    .quick-log-toggle {
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.42rem;
      cursor: pointer;
      text-align: left;
    }
    .quick-log-toggle h2 { margin: 0; }
    .quick-log-chevron {
      display: inline-block;
      font-size: 1.35rem;
      line-height: 1;
      transition: transform 0.18s ease;
    }
    .quick-log-toggle[aria-expanded="true"] .quick-log-chevron {
      transform: rotate(90deg);
    }
    .quick-log-collapsible-content[hidden] { display: none; }

    .entries-label-short { display: none; }

    .mobile-date-nav {
      display: none;
      min-width: 0;
      margin-left: auto;
      align-items: center;
      justify-content: flex-end;
      gap: 0.18rem;
    }
    .mobile-date-nav.hidden { display: none; }
    .mobile-date-nav .icon-btn {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
    }
    .mobile-date-nav .date-button {
      min-width: 0;
      max-width: 104px;
      padding: 0 0.2rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      font-size: 0.88rem;
    }

    @media (max-width: 719px) {
      .topbar { gap: 0.45rem; }
      .brand { flex: 0 0 auto; }
      .mobile-date-nav { display: flex; }
      .page-head > .date-nav { display: none; }

      .entries-section-title {
        flex-wrap: nowrap;
        align-items: center;
        gap: 0.32rem;
      }
      .entries-section-title > h2 {
        flex: 0 0 auto;
        margin: 0;
        white-space: nowrap;
        font-size: clamp(0.88rem, 3.7vw, 1rem);
        line-height: 1.05;
      }
      .entries-header-actions {
        min-width: 0;
        margin-left: auto;
        flex-wrap: nowrap;
        gap: 0.28rem;
      }
      .entries-header-actions .btn.small-btn {
        padding: 0.4rem 0.46rem;
        font-size: 0.72rem;
        white-space: nowrap;
      }
      .entries-header-actions .segmented {
        min-width: 0;
        padding: 0.16rem;
        gap: 0.1rem;
      }
      .entries-header-actions .segmented button {
        padding: 0.36rem 0.39rem;
        font-size: 0.7rem;
        white-space: nowrap;
      }
      .entries-header-actions .entries-label-full { display: none; }
      .entries-header-actions .entries-label-short { display: inline; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" onclick="App.go('today')" aria-label="Go to Today">
        <span class="brand-mark">F</span>
        <span>FoodLog</span>
      </button>
      <div id="mobileDateNav" class="mobile-date-nav hidden" aria-label="Date navigation">
        <button class="icon-btn" type="button" onclick="App.changeDate(-1)" aria-label="Previous day">‹</button>
        <button id="mobileDateButton" class="date-button" type="button" onclick="App.openCalendarPicker()">Date</button>
        <button class="icon-btn" type="button" onclick="App.changeDate(1)" aria-label="Next day">›</button>
      </div>
      <nav class="desktop-nav" id="desktopNav" aria-label="Primary navigation"></nav>
    </header>
    <main id="app" tabindex="-1"></main>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Primary navigation"></nav>
  <button id="fab" class="fab hidden" type="button" onclick="App.openAddSheet()" aria-label="Add food">+</button>

  <div id="sheetBackdrop" class="backdrop hidden" onclick="App.backdropClose(event)">
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Add food">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="sheetContent"></div>
    </section>
  </div>

  <div id="modalBackdrop" class="backdrop modal-backdrop hidden" onclick="App.modalBackdropClose(event)">
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Dialog">
      <div id="modalContent"></div>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <input id="calendarPicker" class="visually-hidden" type="date" onchange="App.pickDate(this.value)" />
  <input id="importPicker" class="visually-hidden" type="file" accept="application/json,.json" onchange="App.handleImportFile(this.files?.[0])" />

  <script src="./app.js"></script>
  <script>
    (() => {
      const app = document.getElementById('app');
      const mobileNav = document.getElementById('mobileDateNav');
      const mobileButton = document.getElementById('mobileDateButton');
      const DEFAULT_DAILY_CALORIE_GOAL = 1500;

      const getDailyCalorieGoal = () => {
        const value = Number(App.cache.settings.dailyCalorieGoal);
        return Number.isFinite(value) && value > 0
          ? Math.round(value)
          : DEFAULT_DAILY_CALORIE_GOAL;
      };

      const originalEnsureSettings = App.ensureSettings;
      App.ensureSettings = async function() {
        await originalEnsureSettings.call(this);
        const existing = await this.db.get('settings', 'dailyCalorieGoal');
        if (!existing) {
          await this.db.put('settings', {
            key: 'dailyCalorieGoal',
            value: DEFAULT_DAILY_CALORIE_GOAL,
          });
        }
      };

      const originalRenderToday = App.renderToday;
      App.renderToday = async function() {
        const html = await originalRenderToday.call(this);
        const total = this.totalForDate();
        const goal = getDailyCalorieGoal();
        const scaleMax = total <= goal
          ? goal
          : Math.max(goal, Math.ceil(total / 500) * 500);
        const percent = Math.min(100, total / scaleMax * 100);
        const scaleLabel = total <= goal
          ? `Goal ${this.formatNumber(goal)}`
          : `Goal ${this.formatNumber(goal)} · Scale ${this.formatNumber(scaleMax)}`;

        return html.replace(
          /<div class="row space tiny muted"><span>Accumulated<\/span><span>Auto-scale [^<]+<\/span><\/div>\s*<div class="accumulation-track"><div class="accumulation-fill" style="width:[^"]+"><\/div><\/div>/,
          `<div class="row space tiny muted"><span>Accumulated</span><span>${scaleLabel}</span></div>
            <div class="accumulation-track"><div class="accumulation-fill" style="width:${percent}%"></div></div>`
        );
      };

      const originalRenderSettings = App.renderSettings;
      App.renderSettings = async function() {
        const html = await originalRenderSettings.call(this);
        const goal = getDailyCalorieGoal();
        const goalSetting = `
              <label>Daily calorie goal
                <input id="dailyCalorieGoalSetting" type="number" min="1" max="100000" step="50" inputmode="numeric" value="${goal}" onchange="App.saveDailyCalorieGoal(this.value)" />
                <span class="field-help">Used by the Today progress bar. The scale expands automatically after you pass the goal.</span>
              </label>`;
        return html.replace('<div class="settings-list">', `<div class="settings-list">${goalSetting}`);
      };

      App.saveDailyCalorieGoal = async value => {
        const goal = Math.round(Number(value));
        if (!Number.isFinite(goal) || goal < 1 || goal > 100000) {
          const input = document.getElementById('dailyCalorieGoalSetting');
          if (input) input.value = getDailyCalorieGoal();
          App.showToast('Enter a daily goal between 1 and 100,000 calories');
          return;
        }
        await App.setSetting('dailyCalorieGoal', goal);
        await App.render();
        App.showToast(`Daily goal set to ${App.formatNumber(goal)} calories`);
      };

      const originalOpenFoodEditor = App.openFoodEditor;
      App.openFoodEditor = async function(id = '') {
        await originalOpenFoodEditor.call(this, id);
        const form = document.querySelector('#modalContent form');
        const portionsLabel = document.getElementById('foodEditPortions')?.closest('label');
        if (!form || !portionsLabel || document.getElementById('foodEditNotes')) return;
        const food = id ? this.cache.foods.find(item => item.id === id) : null;
        const notesLabel = document.createElement('label');
        notesLabel.innerHTML = `Notes <span class="field-help">Optional · only visible when editing this food</span><textarea id="foodEditNotes" placeholder="Private notes about this saved food">${this.esc(food?.notes || '')}</textarea>`;
        form.insertBefore(notesLabel, portionsLabel);
      };

      const originalCollectFoodForm = App.collectFoodForm;
      App.collectFoodForm = function(id) {
        const payload = originalCollectFoodForm.call(this, id);
        payload.notes = document.getElementById('foodEditNotes')?.value.trim() || '';
        return payload;
      };

      App.persistFoodForm = async function(payload) {
        const { existing } = payload;
        const now = new Date().toISOString();
        if (existing) {
          await this.db.put('revisions', {
            id: this.uid('revision'), entityId: existing.id, entityType: 'food',
            snapshot: structuredClone(existing), createdAt: now,
          });
        }
        const record = {
          ...(existing || {}),
          id: existing?.id || this.uid('food'),
          name: payload.name,
          nameLower: this.normalizeName(payload.name),
          calories: payload.calories,
          pinned: payload.pinned,
          source: payload.source,
          folder: payload.folder,
          tags: payload.tags,
          aliases: payload.aliases,
          portions: payload.portions,
          notes: payload.notes || '',
          useCount: existing?.useCount || 0,
          lastUsedAt: existing?.lastUsedAt || '',
          createdAt: existing?.createdAt || now,
          updatedAt: now,
        };
        await this.db.put('foods', record);
        this.closeModal();
        await this.refreshCache();
        await this.render();
        this.showToast(existing ? 'Saved food updated' : 'Saved food added');
      };

      const syncMobileDateNav = () => {
        const pageDateButton = app.querySelector('.date-nav .date-button');
        const hasDatePicker = Boolean(pageDateButton);
        mobileNav.classList.toggle('hidden', !hasDatePicker);
        if (hasDatePicker) {
          const label = pageDateButton.textContent.trim();
          mobileButton.textContent = label;
          mobileButton.setAttribute('aria-label', `Choose date, currently ${label}`);
        }
      };

      const enhanceQuickLog = () => {
        const heading = [...app.querySelectorAll('.section-title h2')]
          .find(item => item.textContent.trim() === 'Quick Log');
        const section = heading?.closest('section.section');
        if (!section || section.dataset.quickLogCollapsible === 'true') return;

        section.dataset.quickLogCollapsible = 'true';
        const titleRow = heading.closest('.section-title');
        const manageFoodsButton = [...titleRow.querySelectorAll('button')]
          .find(button => button.textContent.trim() === 'Manage foods');
        manageFoodsButton?.remove();
        const content = document.createElement('div');
        content.className = 'quick-log-collapsible-content';
        content.hidden = true;

        [...section.children]
          .filter(child => child !== titleRow)
          .forEach(child => content.appendChild(child));
        section.appendChild(content);

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'quick-log-toggle';
        toggle.setAttribute('aria-expanded', 'false');
        toggle.innerHTML = '<span class="quick-log-chevron" aria-hidden="true">›</span><h2>Quick Log</h2>';
        toggle.addEventListener('click', () => {
          const expanded = toggle.getAttribute('aria-expanded') === 'true';
          toggle.setAttribute('aria-expanded', String(!expanded));
          content.hidden = expanded;
        });
        heading.replaceWith(toggle);
      };

      const enhanceEntriesHeader = () => {
        const heading = [...app.querySelectorAll('.section-title h2')]
          .find(item => ["Today's entries", 'Entries'].includes(item.textContent.trim()));
        const titleRow = heading?.closest('.section-title');
        if (!titleRow || titleRow.dataset.entriesHeaderCompact === 'true') return;

        const actions = titleRow.querySelector('.actions');
        const copyButton = [...(actions?.querySelectorAll('button') || [])]
          .find(button => button.textContent.trim() === 'Copy previous');
        const segmented = actions?.querySelector('.segmented');
        const chronologicalButton = [...(segmented?.querySelectorAll('button') || [])]
          .find(button => button.textContent.trim() === 'Chronological');
        if (!actions || !copyButton || !segmented || !chronologicalButton) return;

        titleRow.dataset.entriesHeaderCompact = 'true';
        titleRow.classList.add('entries-section-title');
        actions.classList.add('entries-header-actions');

        copyButton.setAttribute('aria-label', 'Copy previous entries');
        copyButton.innerHTML = '<span class="entries-label-full">Copy previous</span><span class="entries-label-short" aria-hidden="true">Copy</span>';
        chronologicalButton.setAttribute('aria-label', 'Chronological entry view');
        chronologicalButton.innerHTML = '<span class="entries-label-full">Chronological</span><span class="entries-label-short" aria-hidden="true">Chrono</span>';
      };

      const syncEnhancedUi = () => {
        syncMobileDateNav();
        enhanceQuickLog();
        enhanceEntriesHeader();
      };

      new MutationObserver(syncEnhancedUi).observe(app, { childList: true, subtree: true });
      syncEnhancedUi();
    })();
  </script>
</body>
</html>
