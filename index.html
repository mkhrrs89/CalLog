<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FoodLog" />
  <title>FoodLog</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    /* Disable double-tap zoom while preserving scrolling and pinch-to-zoom. */
    html,
    body,
    button,
    [role="button"] {
      touch-action: manipulation;
    }

    /* iPhone browsers zoom focused form controls when their text is below 16px. */
    @supports (-webkit-touch-callout: none) {
      input, select, textarea {
        font-size: 16px;
      }
    }

    /* Keep food names visually lighter and slightly more compact throughout the app. */
    .food-name,
    .quick-food-main > strong,
    .search-result > span:first-child > strong {
      font-size: 0.9rem;
      font-weight: 400;
    }

    /* Reduce the headline calorie total slightly while preserving its bold emphasis. */
    .total-number {
      font-size: clamp(2.15rem, 10.5vw, 4rem);
      font-weight: 900;
    }

    .quick-log-toggle {
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.42rem;
      cursor: pointer;
      text-align: left;
    }
    .quick-log-toggle h2 { margin: 0; }
    .quick-log-chevron {
      display: inline-block;
      font-size: 1.35rem;
      line-height: 1;
      transition: transform 0.18s ease;
    }
    .quick-log-toggle[aria-expanded="true"] .quick-log-chevron {
      transform: rotate(90deg);
    }
    .quick-log-collapsible-content[hidden] { display: none; }

    .mobile-date-nav {
      display: none;
      min-width: 0;
      margin-left: auto;
      align-items: center;
      justify-content: flex-end;
      gap: 0.18rem;
    }
    .mobile-date-nav.hidden { display: none; }
    .mobile-date-nav .icon-btn {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
    }
    .mobile-date-nav .date-button {
      min-width: 0;
      max-width: 104px;
      padding: 0 0.2rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      font-size: 0.88rem;
    }

    @media (max-width: 719px) {
      .topbar { gap: 0.45rem; }
      .brand { flex: 0 0 auto; }
      .mobile-date-nav { display: flex; }
      .page-head > .date-nav { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" onclick="App.go('today')" aria-label="Go to Today">
        <span class="brand-mark">F</span>
        <span>FoodLog</span>
      </button>
      <div id="mobileDateNav" class="mobile-date-nav hidden" aria-label="Date navigation">
        <button class="icon-btn" type="button" onclick="App.changeDate(-1)" aria-label="Previous day">‹</button>
        <button id="mobileDateButton" class="date-button" type="button" onclick="App.openCalendarPicker()">Date</button>
        <button class="icon-btn" type="button" onclick="App.changeDate(1)" aria-label="Next day">›</button>
      </div>
      <nav class="desktop-nav" id="desktopNav" aria-label="Primary navigation"></nav>
    </header>
    <main id="app" tabindex="-1"></main>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Primary navigation"></nav>
  <button id="fab" class="fab hidden" type="button" onclick="App.openAddSheet()" aria-label="Add food">+</button>

  <div id="sheetBackdrop" class="backdrop hidden" onclick="App.backdropClose(event)">
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Add food">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div id="sheetContent"></div>
    </section>
  </div>

  <div id="modalBackdrop" class="backdrop modal-backdrop hidden" onclick="App.modalBackdropClose(event)">
    <section id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Dialog">
      <div id="modalContent"></div>
    </section>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <input id="calendarPicker" class="visually-hidden" type="date" onchange="App.pickDate(this.value)" />
  <input id="importPicker" class="visually-hidden" type="file" accept="application/json,.json" onchange="App.handleImportFile(this.files?.[0])" />

  <script src="./app.js"></script>
  <script>
    (() => {
      const app = document.getElementById('app');
      const mobileNav = document.getElementById('mobileDateNav');
      const mobileButton = document.getElementById('mobileDateButton');

      const syncMobileDateNav = () => {
        const pageDateButton = app.querySelector('.date-nav .date-button');
        const hasDatePicker = Boolean(pageDateButton);
        mobileNav.classList.toggle('hidden', !hasDatePicker);
        if (hasDatePicker) {
          const label = pageDateButton.textContent.trim();
          mobileButton.textContent = label;
          mobileButton.setAttribute('aria-label', `Choose date, currently ${label}`);
        }
      };

      const enhanceQuickLog = () => {
        const heading = [...app.querySelectorAll('.section-title h2')]
          .find(item => item.textContent.trim() === 'Quick Log');
        const section = heading?.closest('section.section');
        if (!section || section.dataset.quickLogCollapsible === 'true') return;

        section.dataset.quickLogCollapsible = 'true';
        const titleRow = heading.closest('.section-title');
        const manageFoodsButton = [...titleRow.querySelectorAll('button')]
          .find(button => button.textContent.trim() === 'Manage foods');
        manageFoodsButton?.remove();
        const content = document.createElement('div');
        content.className = 'quick-log-collapsible-content';
        content.hidden = true;

        [...section.children]
          .filter(child => child !== titleRow)
          .forEach(child => content.appendChild(child));
        section.appendChild(content);

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'quick-log-toggle';
        toggle.setAttribute('aria-expanded', 'false');
        toggle.innerHTML = '<span class="quick-log-chevron" aria-hidden="true">›</span><h2>Quick Log</h2>';
        toggle.addEventListener('click', () => {
          const expanded = toggle.getAttribute('aria-expanded') === 'true';
          toggle.setAttribute('aria-expanded', String(!expanded));
          content.hidden = expanded;
        });
        heading.replaceWith(toggle);
      };

      const syncEnhancedUi = () => {
        syncMobileDateNav();
        enhanceQuickLog();
      };

      new MutationObserver(syncEnhancedUi).observe(app, { childList: true, subtree: true });
      syncEnhancedUi();
    })();
  </script>
</body>
</html>
